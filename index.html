    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ЗАП ОПТОМ">
    <script>
        // Синхронно (ДО загрузки React) подстраиваем манифест и apple-mobile-web-app-title
        // под /admin. Это критично именно для iOS Safari: при «Добавить на экран Домой»
        // название и манифест берутся из состояния DOM в момент добавления, а не пересчитываются
        // потом из React — иначе установленный на /admin ярлык откроет весь сайт, а не админку.
        if (location.pathname.indexOf('/admin') === 0) {
            document.querySelector('link[rel="manifest"]').setAttribute('href', '/admin-manifest.webmanifest');
            document.querySelector('meta[name="apple-mobile-web-app-title"]').setAttribute('content', 'Заявки');
            document.title = 'ЗАП ОПТОМ — Заявки';
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Обязательные платформенные скрипты ниже (cdn.poehali.dev) блокируют парсинг страницы —
         соединение с их доменом открываем заранее, пока браузер ещё читает верх <head>, чтобы
         к моменту их загрузки не тратить время на DNS/TLS-хендшейк. -->
    <link rel="preconnect" href="https://cdn.poehali.dev" crossorigin />
    <!-- Шрифт подключаем НЕ блокирующим первую отрисовку способом (media="print" переключается
         на "all" только после загрузки). Обычный <link rel="stylesheet"> тут — render-blocking
         ресурс: браузер держит экран пустым (белым) до его загрузки, и на iOS в установленном
         приложении в этот момент светлый текст статус-бара (оператор, батарея) сливается с белым
         фоном и выглядит как "мигание" при запуске. Заставка ниже не должна ждать шрифт. -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Rubik:wght@400;500;600&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Rubik:wght@400;500;600&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Rubik:wght@400;500;600&display=swap" /></noscript>
    <style>
        /* Красим ТОЛЬКО html (используется браузером как цвет canvas — самый нижний слой,
           виден даже под элементами с отрицательным z-index) в цвет заставки сразу, СИНХРОННО
           и раньше любых внешних ресурсов — первый кадр всегда тёмный, экран никогда не бывает
           белым (тем самым не "мигает" статус-бар iOS поверх него).
           ВАЖНО: body оставляем прозрачным — если задать фон и на body, он как обычный блочный
           элемент рисуется НАД слоями с отрицательным z-index и полностью перекрывает собой
           фоновую текстуру сайта (AppBackground, fixed + -z-10). */
        html {
            background: #0e0e0f;
        }
        /* Заставка при холодном старте приложения (в т.ч. установленного PWA) — показывается
           мгновенно из чистого HTML/CSS, ещё до загрузки и разбора JS-бандла, и скрывается
           сразу после монтирования React (см. src/main.tsx). Стили самодостаточны и не зависят
           от Tailwind/CSS-переменных проекта, чтобы отрисоваться без единого лишнего запроса. */
        #app-splash {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: radial-gradient(120% 90% at 50% 38%, #1a1b1d 0%, #0e0e0f 72%);
            transition: opacity .45s ease, visibility .45s ease;
        }
        #app-splash.app-splash--hide {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        .app-splash__title {
            margin: 0;
            font-family: 'Oswald', sans-serif;
            font-weight: 700;
            font-size: clamp(1.9rem, 8.5vw, 3rem);
            letter-spacing: 0.05em;
            text-transform: uppercase;
            text-align: center;
            color: #3a3b3f;
            text-shadow:
                -1.5px -1.5px 1.5px rgba(0, 0, 0, 0.85),
                1.5px 1.5px 1.5px rgba(255, 255, 255, 0.07),
                0 0 16px rgba(229, 67, 42, 0.3);
            animation: app-splash-glow 2.4s ease-in-out infinite;
        }
        .app-splash__subtitle {
            display: block;
            margin-top: 12px;
            font-family: 'Rubik', sans-serif;
            font-weight: 500;
            font-size: clamp(0.7rem, 2.6vw, 0.85rem);
            letter-spacing: 0.34em;
            text-transform: uppercase;
            text-align: center;
            color: #8c8a83;
        }
        .app-splash__loader {
            margin-top: 34px;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 3px solid rgba(229, 67, 42, 0.18);
            border-top-color: #e5432a;
            animation: app-splash-spin 0.85s linear infinite;
        }
        @keyframes app-splash-glow {
            0%, 100% {
                text-shadow:
                    -1.5px -1.5px 1.5px rgba(0, 0, 0, 0.85),
                    1.5px 1.5px 1.5px rgba(255, 255, 255, 0.07),
                    0 0 10px rgba(229, 67, 42, 0.22);
            }
            50% {
                text-shadow:
                    -1.5px -1.5px 1.5px rgba(0, 0, 0, 0.85),
                    1.5px 1.5px 1.5px rgba(255, 255, 255, 0.07),
                    0 0 30px rgba(229, 67, 42, 0.62);
            }
        }
        @keyframes app-splash-spin {
            to { transform: rotate(360deg); }
        }
        @media (prefers-reduced-motion: reduce) {
            .app-splash__title,
            .app-splash__loader {
                animation: none;
            }
        }
    </style>

<script>
    // Синхронно, до первой отрисовки: при повторном визите (заставку уже видели —
    // см. src/main.tsx) сразу помечаем блок как скрытый через inline-style, чтобы
    // браузер не отрисовал его вообще ни на один кадр — визуально заставки просто нет.
    if (localStorage.getItem('app_splash_seen')) {
        document.write('<div id="app-splash" style="display:none">');
    } else {
        document.write('<div id="app-splash">');
    }
</script>
